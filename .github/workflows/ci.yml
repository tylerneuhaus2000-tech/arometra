name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aro-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run import:dry-run -- --file test/fixtures/catalog-import.json
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
